services:
  app:
    image: berniehuang2008/ai-workflow:latest
    container_name: ai-workflow
    restart: unless-stopped
    ports:
      - "5010:8000"
    environment:
      AI_WORKFLOW_CONFIG: /app/config/config.json
      AI_WORKFLOW_DATA_DIR: /data/ai-workflow
    volumes:
      - ./config:/app/config:ro
      - /data/ai-workflow:/data/ai-workflow
